<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <title>Thank you — Form submitted</title>

  <style>
    :root {
      color-scheme: light;
      --page-background: #f6f7fb;
      --card-background: #ffffff;
      --text-color: #323338;
      --muted-color: #676879;
      --notice-background: #f6f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 58px 20px;
      background: var(--page-background);
      color: var(--text-color);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .confirmation-card {
      width: 100%;
      max-width: 576px;
      margin: 0 auto;
      padding: 40px 48px 44px;
      text-align: center;
      background: var(--card-background);
      border: 1px solid #eceef3;
      border-radius: 16px;
      box-shadow:
        0 3px 6px rgba(0, 0, 0, 0.13),
        0 8px 18px rgba(0, 0, 0, 0.03);
    }

    .illustration {
      display: block;
      width: 240px;
      max-width: 100%;
      height: 150px;
      margin: 0 auto 28px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(26px, 5vw, 30px);
      font-weight: 600;
      line-height: 1.25;
    }

    .message {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
    }

    .notice {
      margin-top: 64px;
      padding: 19px 16px;
      background: var(--notice-background);
      border-radius: 8px;
    }

    .notice p {
      margin: 0;
      color: var(--muted-color);
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 16px;
      }

      .confirmation-card {
        padding: 32px 24px;
      }

      .notice {
        margin-top: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="confirmation-card" aria-labelledby="confirmation-title">
    <!-- Decorative illustration; no external image files required. -->
    <svg
      class="illustration"
      viewBox="0 0 260 160"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <linearGradient id="plane-main" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#f9d8e7"/>
          <stop offset="100%" stop-color="#eeb1ce"/>
        </linearGradient>

        <linearGradient id="plane-fold" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#f5cee1"/>
          <stop offset="100%" stop-color="#a977b9"/>
        </linearGradient>
      </defs>

      <g fill="#fff0f6">
        <path d="
          M28 82
          C12 82 10 59 27 55
          C24 33 49 22 62 42
          C72 34 86 40 88 54
          C110 49 120 78 99 82 Z
        "/>

        <path d="
          M194 58
          C181 58 180 41 191 37
          C191 21 212 18 218 34
          C233 27 247 43 238 54
          C234 59 222 58 194 58 Z
        "/>

        <path d="
          M131 27
          C122 27 122 16 129 14
          C129 6 141 5 144 14
          C153 12 158 22 151 26 Z
        "/>
      </g>

      <path
        d="M127 101
           C96 84 79 107 100 121
           C120 134 129 110 111 105
           M112 125
           C112 139 107 146 100 153"
        fill="none"
        stroke="#d7d8df"
        stroke-width="1.4"
        stroke-dasharray="4 5"
        stroke-linecap="round"
      />

      <polygon
        points="113,63 202,10 150,113"
        fill="url(#plane-main)"
      />

      <polygon
        points="113,63 130,100 202,10"
        fill="#f7c5dc"
      />

      <polygon
        points="130,100 136,76 202,10"
        fill="url(#plane-fold)"
      />

      <polygon
        points="136,76 181,93 202,10"
        fill="url(#plane-main)"
      />

      <polygon
        points="130,100 130,80 145,85"
        fill="#d89ac3"
      />
    </svg>

    <h1 id="confirmation-title">Thank you!</h1>

    <p class="message">
      Your form has been submitted.
    </p>

    <div class="notice">
      <p>
        No further action is needed.<br>
        You may safely close this tab.
      </p>
    </div>
  </main>
</body>
</html>
